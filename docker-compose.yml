services:
  desktrack:
    build: .
    image: desktrack:latest
    container_name: desktrack
    restart: unless-stopped
    ports:
      # Host port 8010 → app 8000 (avoids clashing with other services on :8000)
      - "8010:8000"
    env_file:
      - .env
    environment:
      DESKTRACK_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"
      SEED_DEMO: "false"
      DATABASE_URL: sqlite:////app/data/office.db
      # Lower CPU/RAM on small VPS
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OPENCV_FOR_THREADS_NUM: "1"
    volumes:
      - desktrack_data:/app/data
      - desktrack_models:/app/yolo_model
    # Soft cap so DeskTrack cannot starve the whole VPS
    mem_limit: 1024m
    memswap_limit: 1280m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  desktrack_data:
  desktrack_models:
