# DeskTrack — Nginx reverse proxy
# 1) Point DNS A record: desktrack.YOURDOMAIN.com → 103.204.169.245
# 2) Copy to /etc/nginx/sites-available/desktrack
# 3) ln -s … sites-enabled, nginx -t, reload
# 4) certbot --nginx -d desktrack.YOURDOMAIN.com

server {
    listen 80;
    listen [::]:80;
    server_name desktrack.YOURDOMAIN.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
